<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>sign up</title>
</head>
<body>
 <link rel="stylesheet" href="./signup.css">
 <form action="">
 <fieldset>
 <legend>Signup</legend>
 <label for="fname">First name:</label>
 <input type="text" id="fname" placeholder="enter first name" name="lname">
 <br><br>
 <label for="lname">last name:</label>
 <input type="text" id="lname" placeholder="enter last name" name="lname">
 <br><br>
 <label for="email"> enter your email:</label>
 <input type="email" id="email" name="email" placeholder="enter email name">
 <br><br>
 <label for="password">password:</label>
 <input type="password" id="password" placeholder="enter the password" name="password">
 <br><br>
 <label for="DOB">DOB:</label>
 <input type="date" name="DOB" id="DOB">
 <br><br>
 <label for="phno">ph number:</label>
 <input type="tel" id="phnumber" name="phnumber" placeholder="enter email name">
 <br><br>
 <label for="gender">gender:</label>
 <input type="radio" name="gender" id="gender" value="Male">Male
 <input type="radio" name="gender" id="gender" value="Female">Female
 <input type="radio" name="gender" id="gender" value="Others">Others
 <br><br>
 <button>submit</button>
 <button>reset</button>
 </fieldset>
 </form>
</body>
<script src="./signup.js"></script>
</html>
